version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - COMMIT_SHA=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_SHA:-latest}
  build:
    commands:
      - echo "Build started on `date`"
      - docker build -t $IMAGE_REPOSITORY:$IMAGE_TAG .
      - docker tag $IMAGE_REPOSITORY:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPOSITORY:$IMAGE_TAG
      - echo "Build completed on `date`"
  post_build:
    commands:
      - echo "Push the docker image to AWS ECR..."
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPOSITORY:$IMAGE_TAG
      - echo "Creating Dockerrun.aws.json with new image tag..."
      - |
        cat > Dockerrun.aws.json <<EOL
        {
          "AWSEBDockerrunVersion": 1,
          "Image": {
            "Name": "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPOSITORY:$IMAGE_TAG",
            "Update": "true"
          },
          "Ports": [
            {
              "ContainerPort": "5000"
            }
          ]
        }
        EOL
      - zip Dockerrun.aws.json_$COMMIT_SHA.zip Dockerrun.aws.json
artifacts:
  files:
    - Dockerrun.aws.json_*.zip
